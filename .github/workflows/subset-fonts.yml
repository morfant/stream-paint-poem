# 텍스트/코드가 바뀌면 웹용 폰트 서브셋(fonts/web/)을 다시 만들어 자동 커밋한다.
# 새 글자가 폰트에서 빠져 다른 글꼴로 보이는 일을 막기 위함. (로컬: python3 tools/subset_fonts.py)
name: subset-fonts

on:
  push:
    paths:
      - "sentences_KOR.txt"
      - "sentences_ENG.txt"
      - "sketch.js"
      - "index.html"
      - "tools/subset_fonts.py"
      - "fonts/*.ttf"
      - "fonts/*.otf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subset-fonts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.63.0
      - run: python3 tools/subset_fonts.py
      - run: python3 tools/subset_fonts.py --check
      - name: Commit if changed
        run: |
          if git diff --quiet -- fonts/web; then
            echo "폰트 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fonts/web
          git commit -m "[auto] 웹 폰트 서브셋 갱신"
          git push
